name: Real-Time Marketplace Live Stream

on:
  # 1. Manual execution with real-time streaming controls
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Orders per micro-batch'
        required: true
        default: '15'
        type: string
      interval_seconds:
        description: 'Interval in seconds between micro-batches'
        required: true
        default: '20'
        type: string
      cycles:
        description: 'Number of streaming cycles (e.g. 15 cycles of 20s = ~5 min stream)'
        required: true
        default: '15'
        type: string

  # 2. Automated execution every 15 minutes (streaming micro-batches)
  schedule:
    - cron: '*/15 * * * *'

jobs:
  realtime_stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ingestion Dependencies
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Stream Real-Time Transactions to Neon Cloud
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          BATCH=${{ github.event.inputs.batch_size || '15' }}
          INTERVAL=${{ github.event.inputs.interval_seconds || '25' }}
          CYCLES=${{ github.event.inputs.cycles || '20' }}
          python -m data_generator.stream_producer --batch $BATCH --interval $INTERVAL --cycles $CYCLES
