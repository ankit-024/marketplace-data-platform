version: '3.8'

services:
  # ============================================================================
  # Operational OLTP Database (PostgreSQL 15 with WAL Logical Replication)
  # ============================================================================
  postgres:
    image: debezium/postgres:15-alpine
    container_name: marketplace_postgres
    environment:
      POSTGRES_DB: marketplace_oltp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_oltp.sql:/docker-entrypoint-initdb.d/01_init_oltp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_oltp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
